name: Keep Render Backend Awake
on:
  schedule:
    - cron: '*/5 * * * *'  # every 5 minutes
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render backend health endpoint
        run: |
          curl -fsS https://medigo-backend-3gw5.onrender.com//actuator/health || true
